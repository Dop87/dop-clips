<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dop Clips | IA Viral para Cortes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        :root {
            --bg-color: #0b0c10;
            --neon-purple: #b900ff;
            --neon-blue: #00d2ff;
            --panel-bg: rgba(25, 25, 35, 0.4);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f5;
            --text-muted: #8a8d9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(185, 0, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 210, 255, 0.05), transparent 25%);
            background-attachment: fixed; overflow-x: hidden; display: flex; flex-direction: column;
        }

        /* Navbar Fixa no Topo */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 40px;
            background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--panel-border);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .dop-3d { font-size: 26px; font-weight: 900; background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue)); -webkit-background-clip: text; color: transparent; animation: spin3D 4s linear infinite; display: inline-block; }
        @keyframes spin3D { 0% { transform: perspective(400px) rotateY(0deg); } 100% { transform: perspective(400px) rotateY(360deg); } }
        nav { display: flex; gap: 20px; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        nav a:hover, nav a.active { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }

        /* Layout Principal com Sidebar */
        .main-wrapper { display: flex; margin-top: 70px; flex: 1; }

        /* Sidebar de Projetos */
        .sidebar {
            width: 280px; background: rgba(15, 16, 22, 0.6); border-right: 1px solid var(--panel-border);
            padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; position: fixed; height: calc(100vh - 70px);
        }
        .sidebar h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .project-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .project-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; font-size: 13px; transition: 0.2s; }
        .project-card:hover { border-color: rgba(255,255,255,0.2); }
        .project-date { color: var(--text-muted); font-size: 11px; margin-bottom: 5px; display: block; }
        .project-title { color: var(--neon-blue); font-weight: bold; }

        /* Área de Conteúdo Central */
        .content-area { margin-left: 280px; flex: 1; padding: 40px; display: flex; justify-content: center; }
        .app-container { max-width: 900px; width: 100%; }

        /* Upload Area Renovada */
        .upload-area {
            background: linear-gradient(145deg, rgba(30, 30, 45, 0.4), rgba(20, 20, 30, 0.6));
            border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 60px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); margin-bottom: 30px;
        }
        .upload-area:hover { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.03); transform: translateY(-3px); }
        .upload-icon { font-size: 45px; margin-bottom: 12px; opacity: 0.8; }
        .upload-text { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .upload-sub { font-size: 13px; color: var(--text-muted); }
        #file-input { display: none; }

        /* Novo Design de Grid e Cartões */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .setting-group { background: var(--panel-bg); padding: 25px; border-radius: 18px; border: 1px solid var(--panel-border); backdrop-filter: blur(10px); }
        .setting-group h3 { font-size: 16px; margin-bottom: 20px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
        
        select, input[type="text"] {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 10px; margin-bottom: 20px; font-size: 14px; outline: none; transition: 0.3s;
        }
        select:focus, input[type="text"]:focus { border-color: var(--neon-blue); background: rgba(0,0,0,0.6); }

        /* Nova Lógica de Textos */
        .text-option-card { padding: 12px; border: 1px solid var(--panel-border); border-radius: 8px; font-size: 13px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: flex-start; gap: 10px; background: rgba(0,0,0,0.2); }
        .text-option-card input { margin-top: 3px; accent-color: var(--neon-blue); }
        .text-option-card.active { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.05); }
        .text-info { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block; }

        /* Radio Formats e Previews Modernos */
        .format-label { display: block; margin-bottom: 12px; cursor: pointer; }
        .format-label input { display: none; }
        .format-card { display: flex; align-items: center; gap: 15px; padding: 12px; border: 1px solid var(--panel-border); border-radius: 12px; transition: 0.2s; background: rgba(0,0,0,0.3); }
        .format-label input:checked + .format-card { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.1); }
        .format-text { display: flex; flex-direction: column; }
        .format-title { font-size: 14px; font-weight: 600; color: #fff; }
        .format-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        
        .preview-box { width: 34px; height: 48px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .prev-bordas { background: #000; flex-direction: column; }
        .prev-bordas::after { content: ''; width: 100%; height: 50%; background: linear-gradient(45deg, var(--neon-blue), #0055ff); }
        .prev-central { background: linear-gradient(45deg, var(--neon-blue), #0055ff); border-left: 2px dashed rgba(0,0,0,0.5); border-right: 2px dashed rgba(0,0,0,0.5); }
        .prev-original { width: 48px; height: 28px; background: linear-gradient(45deg, var(--neon-blue), #0055ff); }

        .btn-submit { width: 100%; padding: 20px; border: none; border-radius: 14px; background: linear-gradient(90deg, #8a2be2, #4169e1); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4); }

        .loader { display: none; text-align: center; margin: 60px 0; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--neon-purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .results-area { display: none; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-novo-recorte { padding: 12px 24px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-novo-recorte:hover { background: rgba(255,255,255,0.2); }
        
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .video-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 15px; text-align: center; }
        .video-card video { width: 100%; border-radius: 8px; margin-bottom: 15px; background: #000; }
        .btn-download { display: block; width: 100%; padding: 12px; background: rgba(0, 210, 255, 0.1); color: var(--neon-blue); text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s; border: 1px solid rgba(0, 210, 255, 0.3); }
        .btn-download:hover { background: var(--neon-blue); color: #000; }
        .corte-numero { display: inline-block; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="dop-3d">DOP</div>
            <span style="font-weight: 800; font-size: 18px;">Clips</span>
        </div>
        <nav>
            <a href="#" class="active">Área de Corte ✂️</a>
            <a href="#">Quem Somos</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <aside class="sidebar">
            <h3>📁 Meus Projetos</h3>
            <div class="project-list" id="project-list">
                <!-- Histórico injetado via JS -->
            </div>
        </aside>

        <main class="content-area">
            <div class="app-container">
                <form id="upload-form">
                    <div class="upload-area" id="drop-zone">
                        <div class="upload-icon">📂</div>
                        <div class="upload-text">Arraste seu vídeo aqui</div>
                        <div class="upload-sub" id="file-name">Ou clique para procurar (MP4, MOV até 25min)</div>
                        <input type="file" id="file-input" name="video" accept="video/mp4,video/quicktime" required>
                    </div>

                    <div class="settings-grid">
                        <div class="setting-group">
                            <h3>⏱️ Fatiamento e Formato</h3>
                            <select name="duracao_corte">
                                <option value="15">Fatiar a cada 15 Segundos</option>
                                <option value="30">Fatiar a cada 30 Segundos</option>
                                <option value="60" selected>Fatiar a cada 1 Minuto</option>
                                <option value="120">Fatiar a cada 2 Minutos</option>
                            </select>
                            
                            <label class="format-label">
                                <input type="radio" name="formato" value="vertical_bordas" checked>
                                <div class="format-card">
                                    <div class="preview-box prev-bordas"></div>
                                    <div class="format-text">
                                        <span class="format-title">Vertical com Bordas</span>
                                        <span class="format-desc">Preserva o vídeo no centro.</span>
                                    </div>
                                </div>
                            </label>
                            <label class="format-label">
                                <input type="radio" name="formato" value="corte_central">
                                <div class="format-card">
                                    <div class="preview-box prev-central"></div>
                                    <div class="format-text">
                                        <span class="format-title">Corte Central Seco</span>
                                        <span class="format-desc">Preenche a tela toda.</span>
                                    </div>
                                </div>
                            </label>
                        </div>

                        <div class="setting-group">
                            <h3>✍️ Inserção de Texto</h3>
                            
                            <label class="text-option-card active" id="lbl-nenhum">
                                <input type="radio" name="tipo_texto" value="nenhum" checked onchange="toggleTextForm()">
                                <div>
                                    <strong>Sem Texto</strong>
                                    <span class="text-info">Vídeo limpo, apenas o corte bruto.</span>
                                </div>
                            </label>

                            <label class="text-option-card" id="lbl-fixo">
                                <input type="radio" name="tipo_texto" value="fixo" onchange="toggleTextForm()">
                                <div>
                                    <strong>Texto Fixo (Único)</strong>
                                    <span class="text-info">O mesmo texto em todos os vídeos. Ex: "Me siga para mais!"</span>
                                </div>
                            </label>

                            <label class="text-option-card" id="lbl-sequencial">
                                <input type="radio" name="tipo_texto" value="sequencial" onchange="toggleTextForm()">
                                <div>
                                    <strong>Numeração Automática</strong>
                                    <span class="text-info">O site numera sozinho. Ex: Você digita "Parte", o site faz "Parte 1", "Parte 2"...</span>
                                </div>
                            </label>

                            <div id="text-input-container" style="display: none; margin-top: 15px;">
                                <input type="text" name="texto_usuario" id="texto_usuario" placeholder="Digite seu texto aqui...">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">Iniciar Fatiamento Inteligente</button>
                </form>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <h2 style="font-size: 18px; margin-bottom: 5px;">Processando Múltiplos Cortes...</h2>
                    <p class="text-muted" style="font-size: 13px;">O motor está fatiando seu vídeo do início ao fim.</p>
                </div>

                <div class="results-area" id="results-area">
                    <div class="results-header">
                        <h2>✅ Lote de Cortes Finalizado!</h2>
                        <button class="btn-novo-recorte" onclick="novoRecorte()">+ Fazer Novo Recorte</button>
                    </div>
                    <div class="results-grid" id="results-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Lógica de Toggle do Texto
        function toggleTextForm() {
            const tipo = document.querySelector('input[name="tipo_texto"]:checked').value;
            const container = document.getElementById('text-input-container');
            const input = document.getElementById('texto_usuario');
            
            document.querySelectorAll('.text-option-card').forEach(c => c.classList.remove('active'));
            document.getElementById('lbl-' + tipo).classList.add('active');

            if (tipo === 'nenhum') {
                container.style.display = 'none'; input.value = ''; input.required = false;
            } else if (tipo === 'fixo') {
                container.style.display = 'block'; input.placeholder = 'Ex: Se inscreva no canal'; input.required = true;
            } else if (tipo === 'sequencial') {
                container.style.display = 'block'; input.placeholder = 'Ex: Parte (O site adicionará os números)'; input.required = true;
            }
        }

        // Lógica de Upload Visual
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--neon-blue)"; });
        dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = "");
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.style.borderColor = "";
            if(e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; atualizarNome(); }
        });
        fileInput.addEventListener('change', atualizarNome);

        function atualizarNome() {
            if(fileInput.files.length) { fileName.innerHTML = `<span style="color: var(--neon-blue); font-weight:bold;">${fileInput.files[0].name}</span>`; }
        }

        // Lógica do Histórico (LocalStorage)
        function carregarHistorico() {
            const projetos = JSON.parse(localStorage.getItem('dop_projetos') || '[]');
            const list = document.getElementById('project-list');
            list.innerHTML = projetos.length === 0 ? '<div style="color:var(--text-muted); font-size:12px; text-align:center; padding: 20px 0;">Nenhum projeto salvo.</div>' : '';
            
            projetos.forEach((proj, index) => {
                list.innerHTML += `
                    <div class="project-card">
                        <span class="project-date">${proj.data}</span>
                        <div class="project-title">Projeto ${projetos.length - index}</div>
                        <div style="color:var(--text-muted); font-size:11px; margin-top:5px;">${proj.qtd} Cortes Gerados</div>
                    </div>
                `;
            });
        }
        carregarHistorico();

        function salvarProjeto(qtdCortes) {
            const projetos = JSON.parse(localStorage.getItem('dop_projetos') || '[]');
            const dataAtual = new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            projetos.unshift({ data: dataAtual, qtd: qtdCortes });
            if(projetos.length > 5) projetos.pop(); // Mantém só os últimos 5
            localStorage.setItem('dop_projetos', JSON.stringify(projetos));
            carregarHistorico();
        }

        // Lógica de Novo Recorte
        function novoRecorte() {
            document.getElementById('results-area').style.display = 'none';
            document.getElementById('upload-form').style.display = 'block';
            document.getElementById('upload-form').reset();
            fileName.innerHTML = "Ou clique para procurar (MP4, MOV até 25min)";
            toggleTextForm();
            window.scrollTo(0, 0);
        }

        // Submissão do Formulário
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!fileInput.files.length) return alert("Selecione um vídeo primeiro!");

            const form = document.getElementById('upload-form');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results-area');
            
            form.style.display = 'none';
            loader.style.display = 'block';
            results.style.display = 'none';

            try {
                const response = await fetch('/processar-video', { method: 'POST', body: new FormData(e.target) });
                const data = await response.json();

                if (data.status === 'sucesso' && data.cortes.length > 0) {
                    loader.style.display = 'none';
                    results.style.display = 'block';
                    document.getElementById('results-grid').innerHTML = '';

                    data.cortes.forEach(corte => {
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.innerHTML = `
                            <div class="corte-numero">✂️ Corte ${corte.parte}</div>
                            <video src="${corte.url}" controls></video>
                            <a href="${corte.url}" download="Corte_${corte.parte}_DopClips.mp4" class="btn-download">⬇️ Baixar Corte</a>
                        `;
                        document.getElementById('results-grid').appendChild(card);
                    });
                    
                    salvarProjeto(data.cortes.length);
                } else { throw new Error(data.mensagem || "O vídeo era muito curto para fatiar."); }
            } catch (error) {
                alert("Erro: " + error.message);
                form.style.display = 'block'; loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
